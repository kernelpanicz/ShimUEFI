
name: ShimUEFI BIOS Build

on:
  workflow_dispatch:
    inputs:
      windows_iso_url:
        description: "Direct download URL for the Windows 10 LTSC 2019 ISO"
        required: true
        type: string

permissions:
  contents: read

jobs:
  build:
    name: Build Windows BIOS USB
    runs-on: ubuntu-22.04
    timeout-minutes: 120

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            git \
            gettext \
            xorriso \
            wimtools \
            mtools \
            dosfstools \
            gdisk \
            coreutils \
            curl \
            wget \
            unzip \
            parted \
            ntfs-3g \
            p7zip-full

      - name: Build and install ms-sys
        run: |
          set -euxo pipefail
          git clone https://github.com/pbatard/ms-sys.git /tmp/ms-sys
          cd /tmp/ms-sys
          make
          sudo make install
          command -v ms-sys
          ms-sys --help || true

      - name: Verify project scripts
        run: |
          set -euo pipefail

          echo "Repository contents:"
          find . -maxdepth 4 -type f | sort | head -250

          test -f wintogo/build/build-media.sh
          test -f wintogo/tests/build-media-selftest.sh

          bash -n wintogo/build/build-media.sh
          bash -n wintogo/tests/build-media-selftest.sh

      - name: Run build tests
        run: |
          set -euo pipefail
          bash wintogo/tests/build-media-selftest.sh

      - name: Download Windows ISO
        env:
          ISO_URL: ${{ inputs.windows_iso_url }}
        run: |
          set -euo pipefail

          mkdir -p downloads

          curl -fL \
            --retry 3 \
            --retry-delay 5 \
            "$ISO_URL" \
            -o downloads/windows.iso

          test -s downloads/windows.iso

          echo "ISO downloaded:"
          ls -lh downloads/windows.iso
          file downloads/windows.iso

      - name: Inspect Windows ISO
        run: |
          set -euo pipefail

          echo "ISO directory listing:"
          7z l downloads/windows.iso

          echo "Checking Windows boot image..."
          7z l downloads/windows.iso | grep -iE 'sources/boot\.wim$'

          echo "Checking Windows installation image..."
          7z l downloads/windows.iso | grep -iE 'sources/install\.(wim|esd)$'

      - name: Build BIOS media
        run: |
          set -euo pipefail

          chmod +x wintogo/build/build-media.sh

          bash wintogo/build/build-media.sh \
            --iso "$GITHUB_WORKSPACE/downloads/windows.iso" \
            --boot-mode bios \
            --out "$GITHUB_WORKSPACE/out"

      - name: List build output
        if: success()
        run: |
          echo "Build output:"
          find out -maxdepth 3 -type f -printf '%p (%s bytes)\n'

      - name: Upload BIOS media
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: ShimUEFI-Windows-BIOS
          path: out/
          if-no-files-found: error
          retention-days: 14

      - name: Upload diagnostic logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ShimUEFI-build-diagnostics
          path: |
            downloads/
            out/
          if-no-files-found: ignore
          retention-days: 3
