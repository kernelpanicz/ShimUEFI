
name: ShimUEFI BIOS Build

on:
  workflow_dispatch:
    inputs:
      windows_iso_url:
        description: "Direct download URL for the Windows ISO"
        required: true
        type: string

permissions:
  contents: read

jobs:
  build:
    name: Build Windows 10 BIOS media
    runs-on: ubuntu-22.04
    timeout-minutes: 90

    steps:
      - name: Checkout ShimUEFI
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            git \
            gettext \
            xorriso \
            wimtools \
            mtools \
            dosfstools \
            gdisk \
            coreutils \
            curl \
            wget \
            unzip \
            parted \
            ntfs-3g

      - name: Build and install ms-sys
        run: |
          git clone https://github.com/pbatard/ms-sys.git /tmp/ms-sys
          cd /tmp/ms-sys
          make
          sudo make install
          ms-sys --help

      - name: Check build scripts
        run: |
          test -f wintogo/build/build-media.sh
          test -f wintogo/tests/build-media-selftest.sh

          bash -n wintogo/build/build-media.sh
          bash -n wintogo/tests/build-media-selftest.sh

      - name: Run build tests
        run: |
          bash wintogo/tests/build-media-selftest.sh

      - name: Download Windows ISO
        env:
          ISO_URL: ${{ inputs.windows_iso_url }}
        run: |
          set -euo pipefail
          mkdir -p downloads

          curl -fL --retry 3 \
            "$ISO_URL" \
            -o downloads/windows.iso

          test -s downloads/windows.iso

          echo "ISO downloaded:"
          ls -lh downloads/windows.iso

      - name: Build BIOS media
        run: |
          set -euo pipefail

          chmod +x wintogo/build/build-media.sh

          bash wintogo/build/build-media.sh \
            --iso "$GITHUB_WORKSPACE/downloads/windows.iso" \
            --boot-mode bios \
            --out "$GITHUB_WORKSPACE/out"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ShimUEFI-Windows-BIOS
          path: out/
          if-no-files-found: error
          retention-days: 14
